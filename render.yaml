services:
  # ── Backend: Node.js API ──────────────────────────────────────
  - type: web
    name: lipsa-portfolio-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ADMIN_USERNAME
        sync: false          # set in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false          # set in Render dashboard
      - key: SESSION_SECRET
        sync: false          # set in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your frontend URL e.g. https://lipsa-portfolio-frontend.onrender.com
    healthCheckPath: /api/content

  # ── Frontend: React (Vite static site) ───────────────────────
  - type: web
    name: lipsa-portfolio-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend URL e.g. https://lipsa-portfolio-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
